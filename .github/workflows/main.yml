
name: Build BuyAnything Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'buyanything_native_platform.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o buyanything_native_platform.zip -d project
          ls -la project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd project
          find . -name gradlew -type f
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuyAnything-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
